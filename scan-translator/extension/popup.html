<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Scan Translator FR</title>
    <style>
      body {
        font-family: sans-serif;
        width: 260px;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #555;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      #status {
        font-size: 12px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Scan Translator FR</h1>
    <div id="status">Statut : …</div>
    <button id="toggle">Activer / désactiver sur cette page</button>
    <label for="serverUrl">Adresse du serveur local</label>
    <input id="serverUrl" type="text" placeholder="http://localhost:5055" />
    <script src="popup.js"></script>
  </body>
</html>
